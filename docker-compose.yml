
services:
  yolo:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    container_name: argus_yolo
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.nestjs
    container_name: argus_backend
    ports:
      - "3000:3000"
    environment:
      - YOLO_HOST=yolo
      - YOLO_PORT=8000
    depends_on:
      - yolo
    restart: unless-stopped
