
services:
  yolo:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    container_name: argus_yolo
    env_file: ../ecocycle.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.nestjs
    container_name: argus_backend
    ports:
      - "3000:3000"
    env_file: ../ecocycle.env
    environment:
      - YOLO_HOST=yolo
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
    volumes:
      - ./debug_images:/app/debug_images
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - yolo
    restart: unless-stopped
